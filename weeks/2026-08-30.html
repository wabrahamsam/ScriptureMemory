<title>Scripture Memory — Psalm 103</title>

<style>
  :root {
    --paper: #FAF6EE;
    --paper-raised: #FFFDF9;
    --ink: #3A3530;
    --ink-soft: #6B6258;
    --accent: #8B5E3C;
    --accent-soft: #C9A57E;
    --hairline: #E3DACB;
    --hairline-strong: #D8CFC0;

    --tint-en: #8B5E3C;
    --tint-ta: #A8763F;
    --tint-ml: #1F6F5C;
    --tint-hi: #6E5A8C;
    --tint-te: #B0654A;
    --tint-kn: #4D7A8C;
    --tint-or: #8C7A2E;

    --font-display: 'Source Serif 4', Georgia, serif;
    --font-body: 'Source Sans 3', system-ui, sans-serif;
    --font-ta: 'Noto Serif Tamil', serif;
    --font-ml: 'Noto Sans Malayalam', sans-serif;
    --font-hi: 'Noto Serif Devanagari', serif;
    --font-te: 'Noto Serif Telugu', serif;
    --font-kn: 'Noto Serif Kannada', serif;
    --font-or: 'Noto Serif Oriya', serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  body {
    background-image: radial-gradient(circle at 15% 0%, rgba(139,94,60,0.05), transparent 45%),
                       radial-gradient(circle at 85% 100%, rgba(31,111,92,0.04), transparent 45%);
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 90px; }

  .backlink { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-soft); text-decoration: none; font-size: 13.5px; font-weight: 500; margin-bottom: 18px; }
  .backlink:hover { color: var(--accent); }

  header { text-align: center; margin-bottom: 22px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
  .dates { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 6vw, 38px); margin: 0; letter-spacing: -0.01em; }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; justify-content: center; gap: 6px; margin: 24px 0 26px; flex-wrap: wrap; }
  .tab {
    font-family: var(--font-body); font-weight: 600; font-size: 13.5px;
    border: 1px solid var(--hairline-strong); background: var(--paper-raised); color: var(--ink-soft);
    padding: 9px 18px; border-radius: 20px; cursor: pointer; transition: all 0.15s;
  }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active { background: var(--ink); color: var(--paper-raised); border-color: var(--ink); }
  .tab.only { cursor: default; }
  .tab.only:hover { border-color: var(--hairline-strong); color: var(--ink-soft); }

  /* ---------- Verse card ---------- */
  .version-panel { display: none; }
  .version-panel.active { display: block; }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 30px 30px 26px;
    box-shadow: 0 1px 2px rgba(58,53,48,0.04), 0 8px 24px -16px rgba(58,53,48,0.18);
    max-width: 100%;
    overflow: hidden;
  }

  .card-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--hairline);
  }
  .card-head .ref { font-family: var(--font-display); font-weight: 700; font-size: 21px; }
  .card-head .version-tag { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); background: rgba(139,94,60,0.08); padding: 5px 11px; border-radius: 20px; }

  .lang-block { padding: 14px 0; border-top: 1px solid var(--hairline); margin-bottom: 2px; max-width: 100%; }
  .lang-block:first-of-type { border-top: none; padding-top: 4px; }
  .lang-block.nkjv, .lang-block.esv { --lang-tint: var(--tint-en); --lang-tint-bg: #F2EAE0; }
  .lang-block.ta { --lang-tint: var(--tint-ta); --lang-tint-bg: #F4EBDF; }
  .lang-block.ml { --lang-tint: var(--tint-ml); --lang-tint-bg: #E3EDE9; }
  .lang-block.hi { --lang-tint: var(--tint-hi); --lang-tint-bg: #EBE6F0; }
  .lang-block.te { --lang-tint: var(--tint-te); --lang-tint-bg: #F5E8E2; }
  .lang-block.kn { --lang-tint: var(--tint-kn); --lang-tint-bg: #E5EDF0; }
  .lang-block.or { --lang-tint: var(--tint-or); --lang-tint-bg: #F1EDDD; }

  .lang-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .lang-icons { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .lang-ref {
    font-family: var(--font-display); font-style: italic; font-weight: 600;
    font-size: 13px; color: var(--ink-soft); display: block; margin-bottom: 8px;
  }
  .lang-tag {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--lang-tint, var(--ink-soft));
    background: var(--lang-tint-bg, #F0EBE3);
    padding: 4px 10px; border-radius: 20px;
  }
  .verse-text { width: 100%; font-size: 16px; line-height: 1.7; color: var(--ink); margin: 0; overflow-wrap: break-word; word-wrap: break-word; word-break: normal; }
  .verse-text.en { hyphens: auto; -webkit-hyphens: auto; }

  .lang-share-btn {
    flex-shrink: 0;
    width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid transparent; background: transparent;
    color: var(--ink-soft); opacity: 0.6;
    display: flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer;
    transition: opacity 0.15s, background 0.15s, color 0.15s;
  }
  .lang-share-btn:hover { opacity: 1; background: rgba(139,94,60,0.08); color: var(--accent); }
  .lang-share-btn svg { width: 17px; height: 17px; display: block; }

  .lang-practice-btn {
    flex-shrink: 0;
    width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid transparent; background: transparent;
    color: var(--ink-soft); opacity: 0.6;
    display: flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer;
    transition: opacity 0.15s, background 0.15s, color 0.15s;
  }
  .lang-practice-btn:hover { opacity: 1; background: rgba(31,111,92,0.08); color: var(--verdigris); }
  .lang-practice-btn.active {
    opacity: 1;
    background: rgba(31,111,92,0.12);
    color: var(--verdigris);
    border: 1px solid rgba(31,111,92,0.35);
  }
  .lang-practice-btn svg { width: 19px; height: 19px; display: block; }

  .lang-voice-btn {
    flex-shrink: 0;
    width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid transparent; background: transparent;
    color: var(--ink-soft); opacity: 0.6;
    display: flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer;
    transition: opacity 0.15s, background 0.15s, color 0.15s;
  }
  .lang-voice-btn:hover { opacity: 1; background: rgba(139,94,60,0.08); color: var(--accent); }
  .lang-voice-btn.active {
    opacity: 1;
    background: rgba(139,94,60,0.12);
    color: var(--accent);
    border: 1px solid rgba(139,94,60,0.35);
  }
  .lang-voice-btn.unavailable { opacity: 0.25; cursor: not-allowed; }
  .lang-voice-btn.unavailable:hover { opacity: 0.25; background: transparent; color: var(--ink-soft); }
  .lang-voice-btn svg { width: 19px; height: 19px; display: block; }

  .word-blank {
    display: inline-block;
    min-width: 2.4em;
    border-bottom: 2px solid var(--lang-tint, var(--accent-soft));
    cursor: pointer;
    user-select: none;
    color: transparent;
    transition: color 0.1s;
  }
  .word-blank.revealed {
    color: var(--ink);
    cursor: default;
    border-bottom-color: transparent;
  }
  .word-blank:not(.revealed):hover {
    background: rgba(31,111,92,0.07);
  }
  .verse-text.en { font-family: var(--font-display); font-size: 16.5px; }
  .verse-text.ta { font-family: var(--font-ta); font-size: 17px; line-height: 1.85; }
  .verse-text.ml { font-family: var(--font-ml); font-size: 17px; line-height: 1.9; }
  .verse-text.hi { font-family: var(--font-hi); font-size: 17px; line-height: 1.85; }
  .verse-text.te { font-family: var(--font-te); font-size: 17px; line-height: 1.85; }
  .verse-text.kn { font-family: var(--font-kn); font-size: 17px; line-height: 1.85; }
  .verse-text.or { font-family: var(--font-or); font-size: 17px; line-height: 1.85; }
  .verse-text .vline { display: block; }
  .verse-text .vline + .vline { margin-top: 6px; }

  .card-foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--hairline); text-align: center; font-size: 11.5px; color: var(--ink-soft); letter-spacing: 0.02em; }

  /* ---------- Actions ---------- */
  .actions { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  button { font-family: var(--font-body); font-weight: 600; font-size: 13.5px; border: 1px solid var(--hairline-strong); background: var(--paper-raised); color: var(--ink); padding: 10px 18px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--ink); color: var(--paper-raised); border-color: var(--ink); }
  button.primary:hover { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.6; cursor: wait; }

  footer.page-footer { text-align: center; margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--hairline); color: var(--ink-soft); font-size: 12px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 8px;
    font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .wrap { padding: 28px 10px 90px; }
    .card { padding: 18px 14px 16px; }
    .verse-text.ta, .verse-text.hi, .verse-text.ml, .verse-text.te, .verse-text.kn, .verse-text.or { font-size: 16px; }
  }
</style>
</head>

<script>
/* =========================================================
   WEEKLY DATA — edit this block each week, nothing else.
   ========================================================= */
const WEEK = {
  dates: "Aug 30 – Sep 05",
  ref: "Psalm 103",
  versions: [
    {
      key: "main",
      label: "Psalm 103:1-22",
      ref: "Psalm 103:1-22",
      verses: {
        nkjv: {
          ref: "Psalm 103:1-22",
          lines: [
            `Bless the Lord, O my soul; And all that is within me, bless His holy name!`,
            `Bless the Lord, O my soul, And forget not all His benefits:`,
            `Who forgives all your iniquities, Who heals all your diseases,`,
            `Who redeems your life from destruction, Who crowns you with lovingkindness and tender mercies`,
            `Who satisfies your mouth with good things, So that your youth is renewed like the eagle's.`,
            `The Lord executes righteousness And justice for all who are oppressed.`,
            `He made known His ways to Moses, His acts to the children of Israel.`,
            `The Lord is merciful and gracious, Slow to anger, and abounding in mercy.`,
            `He will not always strive with us, Nor will He keep His anger forever.`,
            `He has not dealt with us according to our sins, Nor punished us according to our iniquities.`,
            `For as the heavens are high above the earth, So great is His mercy toward those who fear Him;`,
            `As far as the east is from the west, So far has He removed our transgressions from us.`,
            `As a father pities his children, So the Lord pities those who fear Him.`,
            `For He knows our frame; He remembers that we are dust.`,
            `As for man, his days are like grass; As a flower of the field, so he flourishes.`,
            `For the wind passes over it, and it is gone, And its place remembers it no more.`,
            `But the mercy of the Lord is from everlasting to everlasting On those who fear Him, And His righteousness to children's children,`,
            `To such as keep His covenant, And to those who remember His commandments to do them.`,
            `The Lord has established His throne in heaven, And His kingdom rules over all.`,
            `Bless the Lord, you His angels, Who excel in strength, who do His word, Heeding the voice of His word.`,
            `Bless the Lord, all you His hosts, You ministers of His, who do His pleasure.`,
            `Bless the Lord, all His works, In all places of His dominion. Bless the Lord, O my soul!`
          ]
        },
        esv: {
          ref: "Psalm 103:1-22",
          lines: [
            `Bless the Lord, O my soul, and all that is within me, bless His holy name!`,
            `Bless the Lord, O my soul, and forget not all His benefits,`,
            `who forgives all your iniquity, who heals all your diseases,`,
            `who redeems your life from the pit, who crowns you with steadfast love and mercy`,
            `Who satisfies you with good so that your youth is renewed like the eagle's.`,
            `The Lord works righteousness and justice for all who are oppressed.`,
            `He made known His ways to Moses, His acts to the people of Israel.`,
            `The Lord is merciful and gracious, slow to anger and abounding in steadfast love.`,
            `He will not always chide, nor will He keep His anger forever.`,
            `He does not deal with us according to our sins, nor repay us according to our iniquities.`,
            `For as high as the heavens are above the earth, so great is His steadfast love toward those who fear Him;`,
            `as far as the east is from the west, so far does He remove our transgressions from us.`,
            `As a father shows compassion to his children, so the Lord shows compassion to those who fear Him.`,
            `For He knows our frame; He remembers that we are dust.`,
            `As for man, his days are like grass; he flourishes like a flower of the field;`,
            `for the wind passes over it, and it is gone, and its place knows it no more.`,
            `But the steadfast love of the Lord is from everlasting to everlasting on those who fear Him, and His righteousness to children's children,`,
            `to those who keep His covenant and remember to do His commandments.`,
            `The Lord has established His throne in the heavens, and His kingdom rules over all.`,
            `Bless the Lord, O you His angels, you mighty ones who do His word, obeying the voice of His word!`,
            `Bless the Lord, all His hosts, His ministers, who do His will!`,
            `Bless the Lord, all His works, in all places of His dominion. Bless the Lord, O my soul!`
          ]
        },
        ta: {
          ref: "சங்கீதம் 103:1-22",
          lines: [
            `என் ஆத்துமாவே, கர்த்தரை ஸ்தோத்திரி; என் முழு உள்ளமே, அவருடைய பரிசுத்த நாமத்தை ஸ்தோத்திரி.`,
            `என் ஆத்துமாவே, கர்த்தரை ஸ்தோத்திரி; அவர் செய்த சகல உபகாரங்களையும் மறவாதே.`,
            `அவர் உன் அக்கிரமங்களையெல்லாம் மன்னித்து, உன் நோய்களையெல்லாம் குணமாக்கி`,
            `உன் பிராணனை அழிவுக்கு விலக்கி மீட்டு, உன்னைக் கிருபையினாலும் இரக்கங்களினாலும் முடிசூட்டி`,
            `நன்மையினால் உன் வாயைத் திருப்தியாக்குகிறார்; கழுகுக்குச் சமானமாய் உன் வயது திரும்ப வால வயது போலாகிறது.`,
            `ஒடுக்கப்படுகிற யாவருக்கும், கர்த்தர் நீதியையும் நியாயத்தையும் செய்கிறார்.`,
            `அவர் தமது வழிகளை மோசேக்கும், தமது கிரியைகளை இஸ்ரவேல் புத்திரருக்கும் தெரியப்பண்ணினார்.`,
            `கர்த்தர் உருக்கமும், இரக்கமும், நீடிய சாந்தமும், மிகுந்த கிருபையுமுள்ளவர்.`,
            `அவர் எப்பொழுதும் கடிந்துகொள்ளார்; என்றைக்கும் கோபங்கொண்டிரார்.`,
            `அவர் நம்முடைய பாவங்களுக்குத்தக்கதாக நமக்குச் செய்யாமலும், நம்முடைய அக்கிரமங்களுக்குத் தக்கதாக நமக்குச் சரிக்கட்டாமலும் இருக்கிறார்.`,
            `பூமிக்கு வானம் எவ்வளவு உயரமாயிருக்கிறதோ, அவருக்குப் பயப்படுகிறவர்கள்மேல் அவருடைய கிருபையும் அவ்வளவு பெரிதாயிருக்கிறது.`,
            `மேற்குக்கும் கிழக்குக்கும் எவ்வளவு தூரமோ, அவ்வளவு தூரமாய் அவர் நம்முடைய பாவங்களை நம்மைவிட்டு விலக்கினார்.`,
            `தகப்பன் தன் பிள்ளைகளுக்கு இரங்குகிறதுபோல, கர்த்தர் தமக்குப் பயந்தவர்களுக்கு இரங்குகிறார்.`,
            `நம்முடைய உருவம் இன்னதென்று அவர் அறிவார்; நாம் மண்ணென்று நினைவுகூருகிறார்.`,
            `மனுஷனுடைய நாட்கள் புல்லுக்கு ஒப்பாயிருக்கிறது; வெளியின் புஷ்பத்தைப்போல் பூக்கிறான்.`,
            `காற்று அதின்மேல் வீசினவுடனே அது இல்லாமற்போயிற்று; அது இருந்த இடமும் இனி அதை அறியாது.`,
            `கர்த்தருடைய கிருபையோ அவருக்குப் பயந்தவர்கள்மேலும், அவருடைய நீதி அவர்கள் பிள்ளைகளுடைய பிள்ளைகள்மேலும் அநாதியாய் என்றென்றைக்கும் உள்ளது.`,
            `அவருடைய உடன்படிக்கையைக் கைக்கொண்டு, அவருடைய கட்டளைகளின்படி செய்ய நினைக்கிறவர்கள் மேலேயே உள்ளது.`,
            `கர்த்தர் வானங்களில் தமது சிங்காசனத்தை ஸ்தாபித்திருக்கிறார்; அவருடைய ராஜரிகம் சர்வத்தையும் ஆளுகிறது.`,
            `கர்த்தருடைய வார்த்தையைக் கேட்டு, அவருடைய வசனத்தின்படி செய்கிற பலத்த சவுரியவான்களாகிய அவருடைய தூதர்களே, அவரை ஸ்தோத்திரியுங்கள்.`,
            `கர்த்தருக்குப் பிரியமானதைச் செய்து, அவர் பணிவிடைக்காரராயிருக்கிற அவருடைய சர்வசேனைகளே, அவரை ஸ்தோத்திரியுங்கள்.`,
            `கர்த்தர் ஆளுகிற எவ்விடங்களிலுமுள்ள அவருடைய சகல கிரியைகளே, அவரை ஸ்தோத்திரியுங்கள்; என் ஆத்துமாவே, கர்த்தரை ஸ்தோத்திரி.`
          ]
        },
        ml: {
          ref: "സങ്കീർത്തനങ്ങൾ 103:1-22",
          lines: [
            `എൻ മനമേ, യഹോവയെ വാഴ്ത്തുക; എന്റെ സർവാന്തരംഗവുമേ, അവന്റെ വിശുദ്ധനാമത്തെ വാഴ്ത്തുക.`,
            `എൻ മനമേ, യഹോവയെ വാഴ്ത്തുക; അവന്റെ ഉപകാരങ്ങൾ ഒന്നും മറക്കരുത്.`,
            `അവൻ നിന്റെ അകൃത്യമൊക്കെയും മോചിക്കുന്നു; നിന്റെ സകല രോഗങ്ങളെയും സൗഖ്യമാക്കുന്നു;`,
            `അവൻ നിന്റെ ജീവനെ നാശത്തിൽനിന്നു വീണ്ടെടുക്കുന്നു; അവൻ ദയയും കരുണയും നിന്നെ അണിയിക്കുന്നു.`,
            `നിന്റെ യൗവനം കഴുകനെപ്പോലെ പുതുകി വരത്തക്കവണ്ണം അവൻ നിന്റെ വായ്ക്ക് നന്മകൊണ്ട് തൃപ്തിവരുത്തുന്നു.`,
            `യഹോവ സകല പീഡിതന്മാർക്കുംവേണ്ടി നീതിയും ന്യായവും നടത്തുന്നു.`,
            `അവൻ തന്റെ വഴികളെ മോശെയെയും തന്റെ പ്രവൃത്തികളെ യിസ്രായേൽമക്കളെയും അറിയിച്ചു.`,
            `യഹോവ കരുണയും കൃപയും നിറഞ്ഞവൻ ആകുന്നു; ദീർഘക്ഷമയും മഹാദയയും ഉള്ളവൻ തന്നെ.`,
            `അവൻ എല്ലായ്പോഴും ഭർത്സിക്കയില്ല; എന്നേക്കും കോപം സംഗ്രഹിക്കയുമില്ല.`,
            `അവൻ നമ്മുടെ പാപങ്ങൾക്ക് ഒത്തവണ്ണം നമ്മോടു ചെയ്യുന്നില്ല; നമ്മുടെ അകൃത്യങ്ങൾക്ക് ഒത്തവണ്ണം നമ്മോടു പകരം ചെയ്യുന്നതുമില്ല.`,
            `ആകാശം ഭൂമിക്കുമീതെ ഉയർന്നിരിക്കുന്നതുപോലെ അവന്റെ ദയ അവന്റെ ഭക്തന്മാരോട് വലുതായിരിക്കുന്നു.`,
            `ഉദയം അസ്തമയത്തോട് അകന്നിരിക്കുന്നതുപോലെ അവൻ നമ്മുടെ ലംഘനങ്ങളെ നമ്മോട് അകറ്റിയിരിക്കുന്നു.`,
            `അപ്പന് മക്കളോടു കരുണ തോന്നുന്നതുപോലെ യഹോവയ്ക്ക് തന്റെ ഭക്തന്മാരോടു കരുണ തോന്നുന്നു.`,
            `അവൻ നമ്മുടെ പ്രകൃതി അറിയുന്നുവല്ലോ; നാം പൊടി എന്ന് അവൻ ഓർക്കുന്നു.`,
            `മനുഷ്യന്റെ ആയുസ്സ് പുല്ലുപോലെയാകുന്നു; വയലിലെ പൂപോലെ അവൻ പൂക്കുന്നു.`,
            `കാറ്റ് അതിന്മേൽ അടിക്കുമ്പോൾ അത് ഇല്ലാതെ പോകുന്നു; അതിന്റെ സ്ഥലം പിന്നെ അതിനെ അറികയുമില്ല.`,
            `യഹോവയുടെ ദയയോ എന്നും എന്നേക്കും അവന്റെ ഭക്തന്മാർക്കും അവന്റെ നീതി മക്കളുടെ മക്കൾക്കും ഉണ്ടാകും.`,
            `അവന്റെ നിയമത്തെ പ്രമാണിക്കുന്നവർക്കും അവന്റെ കല്പനകളെ ഓർത്ത് ആചരിക്കുന്നവർക്കും തന്നെ.`,
            `യഹോവ തന്റെ സിംഹാസനത്തെ സ്വർഗത്തിൽ സ്ഥാപിച്ചിരിക്കുന്നു; അവന്റെ രാജത്വം സകലത്തെയും ഭരിക്കുന്നു.`,
            `അവന്റെ വചനത്തിന്റെ ശബ്ദം കേട്ട് അവന്റെ ആജ്ഞ അനുസരിക്കുന്ന വീരന്മാരായി അവന്റെ ദൂതന്മാരായുള്ളോരേ, യഹോവയെ വാഴ്ത്തുവിൻ.`,
            `അവന്റെ ഇഷ്ടം ചെയ്യുന്ന ശുശ്രൂഷക്കാരായി അവന്റെ സകല സൈന്യങ്ങളുമായുള്ളോരേ, യഹോവയെ വാഴ്ത്തുവിൻ;`,
            `അവന്റെ ആധിപത്യത്തിലെ സകല സ്ഥലങ്ങളിലുമുള്ള അവന്റെ സകല പ്രവൃത്തികളുമേ, യഹോവയെ വാഴ്ത്തുവിൻ; എൻ മനമേ, യഹോവയെ വാഴ്ത്തുക.`
          ]
        },
        hi: {
          ref: "भजन संहिता 103:1-22",
          lines: [
            `हे मेरे मन, यहोवा को धन्य कह; और जो कुछ मुझ में है, वह उसके पवित्र नाम को धन्य कहे!`,
            `हे मेरे मन, यहोवा को धन्य कह, और उसके किसी उपकार को न भूलना।`,
            `वही तो तेरे सब अधर्म को क्षमा करता, और तेरे सब रोगों को चंगा करता है,`,
            `वही तो तेरे प्राण को नष्‍ट होने से बचा लेता है, और तेरे सिर पर करुणा और दया का मुकुट बाँधता है`,
            `वही तो तेरी लालसा को उत्तम पदार्थों से तृप्‍त करता है, जिस से तेरी जवानी उकाब के समान नई हो जाती है।`,
            `यहोवा सब पिसे हुओं के लिये धर्म और न्याय के काम करता है।`,
            `उसने मूसा को अपनी गति, और इस्राएलियों पर अपने काम प्रगट किए।`,
            `यहोवा दयालु और अनुग्रहकारी, विलम्ब से कोप करनेवाला और अति करुणामय है।`,
            `वह सर्वदा वादविवाद करता न रहेगा, न उसका क्रोध सदा के लिये भड़का रहेगा।`,
            `उसने हमारे पापों के अनुसार हम से व्यवहार नहीं किया, और न हमारे अधर्म के कामों के अनुसार हम को बदला दिया है।`,
            `जैसे आकाश पृथ्वी के ऊपर ऊँचा है, वैसे ही उसकी करुणा उसके डरवैयों के ऊपर प्रबल है।`,
            `उदयाचल अस्ताचल से जितनी दूर है, उसने हमारे अपराधों को हम से उतनी ही दूर कर दिया है।`,
            `जैसे पिता अपने बालकों पर दया करता है, वैसे ही यहोवा अपने डरवैयों पर दया करता है।`,
            `क्योंकि वह हमारी सृष्‍टि जानता है; और उसको स्मरण रहता है कि मनुष्य मिट्टी ही है।`,
            `मनुष्य की आयु घास के समान होती है, वह मैदान के फूल के समान फूलता है,`,
            `जो पवन लगते ही ठहर नहीं सकता, और न वह अपने स्थान में फिर मिलता है।`,
            `परन्तु यहोवा की करुणा उसके डरवैयों पर युग युग, और उसका धर्म उनके नाती–पोतों पर भी प्रगट होता रहता है।`,
            `अर्थात् उन पर जो उसकी वाचा का पालन करते और उसके उपदेशों को स्मरण करके उन पर चलते हैं।`,
            `यहोवा ने तो अपना सिंहासन स्वर्ग में स्थिर किया है, और उसका राज्य पूरी सृष्‍टि पर है।`,
            `हे यहोवा के दूतो, तुम जो बड़े वीर हो, और उसके वचन के मानने से उसको पूरा करते हो उसको धन्य कहो!`,
            `हे यहोवा की सारी सेनाओ, हे उसके टहलुओ, तुम जो उसकी इच्छा पूरी करते हो, उसको धन्य कहो!`,
            `हे यहोवा की सारी सृष्‍टि, उसके राज्य के सब स्थानों में उसको धन्य कहो। हे मेरे मन, तू यहोवा को धन्य कह!`
          ]
        },
        te: {
          ref: "కీర్తనలు 103:1-22",
          lines: [
            `నా ప్రాణమా, యెహోవాను సన్నుతించుము. నా అంతరంగముననున్న సమస్తమా, ఆయన పరిశుద్ధ నామమును సన్నుతించుము.`,
            `నా ప్రాణమా, యెహోవాను సన్నుతించుము ఆయన చేసిన ఉపకారములలో దేనిని మరువకుము`,
            `ఆయన నీ దోషములన్నిటిని క్షమించువాడు నీ సంకటములన్నిటిని కుదుర్చువాడు.`,
            `సమాధిలోనుండి నీ ప్రాణమును విమోచించు చున్నాడు కరుణాకటాక్షములను నీకు కిరీటముగా ఉంచు చున్నాడు`,
            `పక్షిరాజు యౌవనమువలె నీ యౌవనము క్రొత్తదగు చుండునట్లు మేలుతో నీ హృదయమును తృప్తిపరచుచున్నాడు`,
            `యెహోవా నీతిక్రియలను జరిగించుచు బాధింపబడువారికందరికి న్యాయము తీర్చును`,
            `ఆయన మోషేకు తన మార్గములను తెలియజేసెను ఇశ్రాయేలు వంశస్థులకు తన క్రియలను కనుపరచెను`,
            `యెహోవా దయాదాక్షిణ్య పూర్ణుడు దీర్ఘశాంతుడు కృపాసమృద్ధిగలవాడు.`,
            `ఆయన ఎల్లప్పుడు వ్యాజ్యెమాడువాడు కాడు ఆయన నిత్యము కోపించువాడు కాడు.`,
            `మన పాపములనుబట్టి మనకు ప్రతికారము చేయలేదు మన దోషములనుబట్టి మనకు ప్రతిఫలమియ్యలేదు.`,
            `భూమికంటె ఆకాశము ఎంత ఉన్నతముగా ఉన్నదో ఆయనయందు భయభక్తులు గలవారియెడల ఆయన కృప అంత అధికముగా ఉన్నది.`,
            `పడమటికి తూర్పు ఎంత దూరమో ఆయన మన అతిక్రమములను మనకు అంత దూర పరచియున్నాడు.`,
            `తండ్రి తన కుమారులయెడల జాలిపడునట్లు యెహోవా తనయందు భయభక్తులు గలవారి యెడల జాలిపడును.`,
            `మనము నిర్మింపబడిన రీతి ఆయనకు తెలిసేయున్నది మనము మంటివారమని ఆయన జ్ఞాపకము చేసికొను చున్నాడు.`,
            `నరుని ఆయువు గడ్డివలె నున్నది అడవి పువ్వు పూయునట్లు వాడు పూయును.`,
            `దానిమీద గాలి వీచగా అది లేకపోవును ఆ మీదట దాని చోటు దాని నెరుగదు.`,
            `ఆయన నిబంధనను గైకొనుచు ఆయన కట్టడల ననుసరించి నడచుకొను వారిమీద యెహోవాయందు భయభక్తులు గలవారిమీద`,
            `ఆయన కృప యుగయుగములు నిలుచును ఆయన నీతి వారికి పిల్లపిల్ల తరమున నిలుచును.`,
            `యెహోవా ఆకాశమందు తన సింహాసనమును స్థిరపరచియున్నాడు. ఆయన అన్నిటిమీద రాజ్యపరిపాలనచేయుచున్నాడు.`,
            `యెహోవాదూతలారా, ఆయన ఆజ్ఞకులోబడి ఆయన వాక్యము నెరవేర్చు బలశూరులారా, ఆయనను సన్నుతించుడి.`,
            `యెహోవా సైన్యములారా, ఆయన చిత్తము నెరవేర్చు ఆయన పరిచారకులారా, మీరందరు ఆయనను సన్నుతించుడి.`,
            `యెహోవా ఏలుచుండు స్థలములన్నిటిలో నున్న ఆయన సర్వకార్యములారా, ఆయనను స్తుతించుడి.`
          ]
        },
        kn: {
          ref: "ಕೀರ್ತನೆಗಳು 103:1-22",
          lines: [
            `ನನ್ನ ಮನವೇ, ಯೆಹೋವನನ್ನು ಕೊಂಡಾಡು; ನನ್ನ ಸರ್ವೇಂದ್ರಿಯಗಳೇ, ಆತನ ಪವಿತ್ರನಾಮವನ್ನು ಕೀರ್ತಿಸಿರಿ.`,
            `ನನ್ನ ಮನವೇ, ಯೆಹೋವನನ್ನು ಕೊಂಡಾಡು; ಆತನ ಉಪಕಾರಗಳಲ್ಲಿ ಒಂದನ್ನೂ ಮರೆಯಬೇಡ.`,
            `ಆತನು ನಿನ್ನ ಎಲ್ಲಾ ಅಪರಾಧಗಳನ್ನು ಕ್ಷವಿುಸುವವನೂ ಸಮಸ್ತರೋಗಗಳನ್ನು ವಾಸಿಮಾಡುವವನೂ`,
            `ನಿನ್ನ ಜೀವವನ್ನು ನಾಶದಿಂದ ತಪ್ಪಿಸುವವನೂ ಪ್ರೀತಿಕೃಪೆಗಳೆಂಬ ಕಿರೀಟದಿಂದ ನಿನ್ನನ್ನು ಶೃಂಗರಿಸುವವನೂ ಆಗಿದ್ದಾನೆ.`,
            `ಶ್ರೇಷ್ಠವರಗಳಿಂದ ನಿನ್ನ ಆಶೆಯನ್ನು ಪೂರ್ತಿಗೊಳಿಸುತ್ತಾನೆ; ಹದ್ದಿಗೆ ಬರುವಂತೆಯೇ ನಿನಗೆ ಯೌವನವನ್ನು ತಿರಿಗಿ ಬರಮಾಡುತ್ತಾನೆ.`,
            `ಯೆಹೋವನು ನೀತಿಯನ್ನು ಸಾಧಿಸುವವನಾಗಿ ಕುಗ್ಗಿಹೋದವರೆಲ್ಲರ ನ್ಯಾಯವನ್ನು ಸ್ಥಾಪಿಸುತ್ತಾನೆ.`,
            `ಆತನು ಮೋಶೆಗೆ ತನ್ನ ಮಾರ್ಗವನ್ನೂ ಇಸ್ರಾಯೇಲ್ಯರಿಗೆ ತನ್ನ ಕೃತ್ಯಗಳನ್ನೂ ಪ್ರಕಟಿಸಿದನು.`,
            `ಯೆಹೋವನು ಕನಿಕರವೂ ದಯೆಯೂ ದೀರ್ಘಶಾಂತಿಯೂ ಪೂರ್ಣಪ್ರೀತಿಯೂ ಉಳ್ಳವನು.`,
            `ಆತನು ಯಾವಾಗಲೂ ತಪ್ಪುಹುಡುಕುವವನಲ್ಲ; ನಿತ್ಯವೂ ಕೋಪಿಸುವವನಲ್ಲ.`,
            `ಆತನು ನಮ್ಮ ಪಾಪಗಳಿಗೆ ಸರಿಯಾಗಿ ನಮ್ಮನ್ನು ಶಿಕ್ಷಿಸಲಿಲ್ಲ; ನಮ್ಮ ಅಪರಾಧಗಳಿಗೆ ತಕ್ಕಂತೆ ದಂಡಿಸಲಿಲ್ಲ.`,
            `ಭೂವಿುಯ ಮೇಲೆ ಆಕಾಶವು ಎಷ್ಟು ಉನ್ನತವೋ ಆತನಲ್ಲಿ ಭಯಭಕ್ತಿಯುಳ್ಳವರ ಮೇಲೆ ಆತನ ಕೃಪೆಯು ಅಷ್ಟು ಅಪಾರವಾಗಿದೆ.`,
            `ಪೂರ್ವಕ್ಕೂ ಪಶ್ಚಿಮಕ್ಕೂ ಎಷ್ಟು ದೂರವೋ ನಮ್ಮ ದ್ರೋಹಗಳನ್ನು ನಮ್ಮಿಂದ ತೆಗೆದು ಅಷ್ಟು ದೂರ ಮಾಡಿದ್ದಾನೆ.`,
            `ತಂದೆಯು ಮಕ್ಕಳನ್ನು ಕನಿಕರಿಸುವಂತೆ ಯೆಹೋವನು ತನ್ನಲ್ಲಿ ಭಯಭಕ್ತಿಯುಳ್ಳವರನ್ನು ಕನಿಕರಿಸುತ್ತಾನೆ.`,
            `ಆತನು ನಮ್ಮ ಪ್ರಕೃತಿಯನ್ನು ಬಲ್ಲನು; ನಾವು ಧೂಳಿಯಾಗಿದ್ದೇವೆಂಬದನ್ನು ನೆನಪುಮಾಡಿಕೊಳ್ಳುತ್ತಾನೆ.`,
            `ಮನುಷ್ಯನ ಆಯುಷ್ಕಾಲವು ಹುಲ್ಲಿನಂತಿದೆ; ಅವನು ಅಡವಿಯ ಹೂವಿನ ಹಾಗೆ ಶೋಭಿಸುತ್ತಾನೆ.`,
            `ಗಾಳಿಬಡಿಯುತ್ತಲೇ ಅದು ಹೋಗುವದು; ಅದರ ಸ್ಥಳವು ಅದನ್ನು ತಿರುಗಿ ಕಾಣುವದಿಲ್ಲ.`,
            `ಆದರೆ ಯೆಹೋವನಲ್ಲಿ ಭಯಭಕ್ತಿಯುಳ್ಳವರ ಮೇಲೆ ಆತನ ದಯವು ಯುಗಯುಗಾಂತರಗಳವರೆಗೂ ಇರುತ್ತದೆ.`,
            `ಆತನ ನಿಬಂಧನೆಗಳನ್ನು ಕೈಕೊಂಡು ಆತನ ವಿಧಿಗಳನ್ನು ನೆನಪಿನಲ್ಲಿಟ್ಟುಕೊಂಡು ನಡೆಯುವವರ ಮಕ್ಕಳು ಮೊಮ್ಮಕ್ಕಳವರೆಗೂ ಆತನು ತನ್ನ ನೀತಿಯನ್ನು ಸಾಧಿಸುವನು.`,
            `ಯೆಹೋವನು ಮೇಲಣ ಲೋಕದಲ್ಲಿ ತನ್ನ ಸಿಂಹಾಸನವನ್ನು ಸ್ಥಾಪಿಸಿದ್ದಾನೆ; ಆತನು ಸಮಸ್ತವನ್ನೂ ಆಳುತ್ತಾನೆ.`,
            `ದೇವದೂತರೇ, ಆತನ ಶಬ್ದಕ್ಕೆ ಕಿವಿಗೊಡುವವರೇ, ಆತನ ಆಜ್ಞೆಯನ್ನು ನೆರವೇರಿಸುವ ಪರಾಕ್ರಮಶಾಲಿಗಳೇ, ಯೆಹೋವನನ್ನು ಕೊಂಡಾಡಿರಿ.`,
            `ಆತನ ಸೈನ್ಯಗಳೇ, ಆತನ ಮೆಚ್ಚಿಕೆಯನ್ನು ನೆರವೇರಿಸುವ ಸೇವಕರೇ, ಯೆಹೋವನನ್ನು ಕೊಂಡಾಡಿರಿ.`,
            `ಆತನ ರಾಜ್ಯದ ಸರ್ವಸ್ಥಳಗಳಲ್ಲಿರುವ ಎಲ್ಲಾ ಸೃಷ್ಟಿಗಳೇ, ಯೆಹೋವನನ್ನು ಕೊಂಡಾಡಿರಿ. ನನ್ನ ಮನವೇ, ಯೆಹೋವನನ್ನು ಕೊಂಡಾಡು.`
          ]
        },
        or: {
          ref: "ଗୀତସଂହିତା 103:1-22",
          lines: [
            `ହେ ମୋହର ମନ, ସଦାପ୍ରଭୁଙ୍କର ଧନ୍ୟବାଦ କର; ହେ ମୋହର ଅନ୍ତରସ୍ଥସମସ୍ତ, ତାହାଙ୍କ ପବିତ୍ର ନାମର ଧନ୍ୟବାଦ କର।`,
            `ହେ ମୋହର ମନ ସଦାପ୍ରଭୁଙ୍କର ଧନ୍ୟବାଦ କର ଓ ତାହାଙ୍କର ମଙ୍ଗଳଦାନସବୁ ପାସୋର ନାହିଁ;`,
            `ସେ ତୁମ୍ଭର ଅଧର୍ମସବୁ କ୍ଷମା କରନ୍ତି; ସେ ତୁମ୍ଭର ରୋଗସବୁ ସୁସ୍ଥ କରନ୍ତି;`,
            `ସେ ବିନାଶରୁ ତୁମ୍ଭ ଜୀବନ ମୁକ୍ତ କରନ୍ତି; ସେ ସ୍ନେହପୂର୍ଣ୍ଣ କରୁଣା ଓ ଦୟାରୂପ ମୁକୁଟରେ ତୁମ୍ଭକୁ ଭୂଷିତ କରନ୍ତି`,
            `ସେ ଉତ୍ତମ ବସ୍ତୁରେ ତୁମ୍ଭର ମୁଖ ତୃପ୍ତ କରନ୍ତି; ତହୁଁ ଉତ୍କ୍ରୋଶ ପକ୍ଷୀ ନ୍ୟାୟ ତୁମ୍ଭର ନୂତନ ଯୌବନ ହୁଏ।`,
            `ସଦାପ୍ରଭୁ ଧର୍ମକର୍ମ ସାଧନ କରନ୍ତି ଓ ଉପଦ୍ରବଗ୍ରସ୍ତ ସମସ୍ତଙ୍କ ପକ୍ଷରେ ସୁବିଚାର ନିଷ୍ପତ୍ତି କରନ୍ତି।`,
            `ସେ ମୋଶାଙ୍କୁ ଆପଣା ପଥ ଓ ଇସ୍ରାଏଲ-ସନ୍ତାନଗଣକୁ ଆପଣା କ୍ରିୟାସବୁ ଜଣାଇଲେ।`,
            `ସଦାପ୍ରଭୁ ସ୍ନେହଶୀଳ ଓ କୃପାମୟ, କ୍ରୋଧରେ ଧୀର ଓ ଅତ୍ୟ; ଦୟାଳୁ।`,
            `ସେ ନିରନ୍ତର ଧମକାଇବେ ନାହିଁ; କିଅବା ସଦାକାଳ ଆପଣା କ୍ରୋଧ ରଖିବେ ନାହିଁ।`,
            `ସେ ଆମ୍ଭମାନଙ୍କ ପାପ ପ୍ରମାଣେ ଆମ୍ଭମାନଙ୍କ ପ୍ରତି ବ୍ୟବହାର କରି ନାହାନ୍ତି, କିଅବା ଆମ୍ଭମାନଙ୍କ ଅଧର୍ମାନୁସାରେ ଆମ୍ଭମାନଙ୍କୁ ପ୍ରତିଫଳ ଦେଇ ନାହାନ୍ତି।`,
            `କାରଣ ପୃଥିବୀରୁ ଆକାଶମଣ୍ତଳ ଯେପରି ଉଚ୍ଚ, ସେପରି ତାହାଙ୍କ ଭୟକାରୀମାନଙ୍କ ପ୍ରତି ତାହାଙ୍କ ଦୟା ମହତ।`,
            `ପୂର୍ବରୁ ପଶ୍ଚିମ ଯେତେ ଦୂର, ସେ ଆମ୍ଭମାନଙ୍କ-ଠାରୁ ଆମ୍ଭମାନଙ୍କ ଅପରାଧ ସେତେ ଦୂର କରିଅଛନ୍ତି।`,
            `ପିତା ଆପଣା ସନ୍ତାନଗଣ ପ୍ରତି ଯେରୂପ ସ୍ନେହ ବହଇ, ସଦାପ୍ରଭୁ ଆପଣା ଭୟକାରୀମାନଙ୍କ ପ୍ରତି ସେରୂପ ସ୍ନେହ ବହନ୍ତି।`,
            `କାରଣ ସେ ଆମ୍ଭମାନଙ୍କର ଗଠନ ଜାଣନ୍ତି; ଆମ୍ଭେମାନେ ସେ ଧୂଳିମାତ୍ର, ଏହା ସେ ସ୍ମରଣ କରନ୍ତି।`,
            `ମର୍ତ୍ତ୍ୟର ଦିନ ତୃଣ ତୁଲ୍ୟ; ଯେପରି କ୍ଷେତ୍ରର ଫୁଲ, ସେପରି ସେ ପ୍ରଫୁଲ୍ଲ ହୁଏ।`,
            `ତହିଁ ଉପରେ ବାୟୁ ବହିଲେ, ତାହା ନ ଥାଏ, ପୁଣି ତହିଁର ସ୍ଥାନ ଆଉ ତାହାର ପରିଚୟ ପାଇବ ନାହିଁ।`,
            `ମାତ୍ର ସଦାପ୍ରଭୁଙ୍କ ଦୟା ଅନାଦିକାଳରୁ ଅନନ୍ତକାଳ ପର୍ଯ୍ୟନ୍ତ ଆପଣା ଭୟକାରୀମାନଙ୍କ ପ୍ରତି ଥାଏ ଓ ଯେଉଁମାନେ ତାହାଙ୍କର ନିୟମ ରକ୍ଷା କରନ୍ତି,`,
            `ପୁଣି ପାଳନାର୍ଥେ ତାହାଙ୍କ ବିଧିସବୁ ସ୍ମରଣ କରନ୍ତି, ସେମାନଙ୍କ ପ୍ରତି ତାହାଙ୍କର ଧର୍ମ ପୁତ୍ରପୌତ୍ରାଦିକ୍ରମେ ଥାଏ।`,
            `ସଦାପ୍ରଭୁ ସ୍ଵର୍ଗରେ ଆପଣା ସିଂହାସନ ସ୍ଥାପନ କରିଅଛନ୍ତି; ପୁଣି, ତାହାଙ୍କ ରାଜ୍ୟ ସମସ୍ତଙ୍କ ଉପରେ କର୍ତ୍ତୃତ୍ଵ କରେ।`,
            `ହେ ସଦାପ୍ରଭୁଙ୍କ ବାକ୍ୟସାଧକ ଓ ତାହାଙ୍କ ବାକ୍ୟର ରବ ଶ୍ରବଣକାରୀ, ବଳରେ ପରାକ୍ରା; ଦୂତଗଣ, ତୁମ୍ଭେମାନେ ତାହାଙ୍କର ଧନ୍ୟବାଦ କର।`,
            `ହେ ସଦାପ୍ରଭୁଙ୍କର ପରିଚାରକ ଓ ତାହାଙ୍କ ଅଭିମତସାଧକ ସୈନ୍ୟସକଳ, ତୁମ୍ଭେମାନେ ତାହାଙ୍କର ଧନ୍ୟବାଦ କର।`,
            `ହେ ସଦାପ୍ରଭୁଙ୍କ ହସ୍ତକୃତ କର୍ମସକଳ, ତୁମ୍ଭେମାନେ ତାହାଙ୍କ ରାଜ୍ୟର ସର୍ବତ୍ର ତାହାଙ୍କର ଧନ୍ୟବାଦ କର; ହେ ମୋହର ମନ, ସଦାପ୍ରଭୁଙ୍କର ଧନ୍ୟବାଦ କର।`
          ]
        }
      }
    }
  ]
};
/* ========================================================= */

const LANG_META = {
  nkjv: { tag: "NKJV", cls: "nkjv en", bcp47: "en-US" },
  esv:  { tag: "ESV",  cls: "esv en", bcp47: "en-US" },
  ta:   { tag: "Tamil", cls: "ta", bcp47: "ta-IN" },
  ml:   { tag: "Malayalam", cls: "ml", bcp47: "ml-IN" },
  hi:   { tag: "Hindi", cls: "hi", bcp47: "hi-IN" },
  te:   { tag: "Telugu", cls: "te", bcp47: "te-IN" },
  kn:   { tag: "Kannada", cls: "kn", bcp47: "kn-IN" },
  or:   { tag: "Odia", cls: "or", bcp47: "or-IN" }
};
const LANG_ORDER = ["nkjv", "esv", "ta", "ml", "hi", "te", "kn", "or"];

document.getElementById('datesLabel').textContent = WEEK.dates;
document.getElementById('refLabel').textContent = WEEK.ref;

const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

// Coordinates voice playback so starting one language's audio stops any other currently playing.
const activeVoiceStoppers = [];
function stopAllVoicesExcept(exceptBtn) {
  activeVoiceStoppers.forEach(stopFn => stopFn());
}

function buildLangBlock(langKey, lines, langRef) {
  const meta = LANG_META[langKey];
  const block = document.createElement('div');
  block.className = `lang-block ${meta.cls}`;

  const header = document.createElement('div');
  header.className = 'lang-header';

  const tag = document.createElement('div');
  tag.className = 'lang-tag';
  tag.textContent = meta.tag;

  const refSpan = document.createElement('span');
  refSpan.className = 'lang-ref';
  refSpan.textContent = langRef;

  const shareBtn = document.createElement('button');
  shareBtn.className = 'lang-share-btn';
  shareBtn.title = `Share ${meta.tag} only`;
  shareBtn.setAttribute('aria-label', `Share ${meta.tag} only`);
  shareBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="5" r="2.7"></circle>
    <circle cx="6" cy="12" r="2.7"></circle>
    <circle cx="18" cy="19" r="2.7"></circle>
    <line x1="8.4" y1="10.7" x2="15.6" y2="6.3"></line>
    <line x1="8.4" y1="13.3" x2="15.6" y2="17.7"></line>
  </svg>`;
  shareBtn.addEventListener('click', () => shareSingleLanguage(langRef, meta.tag, lines));

  const EYE_OPEN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
    <circle cx="12" cy="12" r="2.5"></circle>
  </svg>`;
  const EYE_CROSSED = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
    <circle cx="12" cy="12" r="2.5"></circle>
    <line x1="3" y1="3" x2="21" y2="21"></line>
  </svg>`;

  const practiceBtn = document.createElement('button');
  practiceBtn.className = 'lang-practice-btn';
  practiceBtn.title = `Practice ${meta.tag}`;
  practiceBtn.setAttribute('aria-label', `Practice ${meta.tag} — hide some words to test memorization`);
  practiceBtn.innerHTML = EYE_OPEN;

  // Cycle: off -> A hidden -> off -> B hidden -> off -> C (all hidden) -> off -> A...
  let practiceState = 'off'; // 'off' | 'A' | 'B' | 'C'
  let nextPattern = 'A';

  practiceBtn.addEventListener('click', () => {
    if (practiceState === 'off') {
      practiceState = nextPattern;
      nextPattern = nextPattern === 'A' ? 'B' : (nextPattern === 'B' ? 'C' : 'A');
    } else {
      practiceState = 'off';
    }

    practiceBtn.classList.toggle('active', practiceState !== 'off');
    practiceBtn.innerHTML = practiceState !== 'off' ? EYE_CROSSED : EYE_OPEN;

    wordCounterRef.count = 0;
    text.querySelectorAll('.vline').forEach((lineEl, lineIdx) => {
      renderLine(lineEl, lines[lineIdx], practiceState, wordCounterRef);
    });
  });

  const PLAY_ICON = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <path d="M7 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 7 5.5z"></path>
  </svg>`;
  const STOP_ICON = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <rect x="6" y="6" width="12" height="12" rx="1.5"></rect>
  </svg>`;

  const voiceBtn = document.createElement('button');
  voiceBtn.className = 'lang-voice-btn';
  voiceBtn.innerHTML = PLAY_ICON;

  const voiceSupported = ('speechSynthesis' in window);
  let voiceForLang = null;

  function findVoice() {
    if (!voiceSupported) return null;
    const voices = window.speechSynthesis.getVoices();
    const exact = voices.filter(v => v.lang === meta.bcp47);
    if (exact.length) return exact[0];
    const base = meta.bcp47.split('-')[0];
    const fallback = voices.filter(v => v.lang && v.lang.startsWith(base));
    return fallback.length ? fallback[0] : null;
  }

  function refreshVoiceAvailability() {
    voiceForLang = findVoice();
    const available = voiceSupported && !!voiceForLang;
    voiceBtn.classList.toggle('unavailable', !available);
    voiceBtn.title = available
      ? `Listen to ${meta.tag} on loop`
      : `No voice available for ${meta.tag} on this device`;
    voiceBtn.setAttribute('aria-label', voiceBtn.title);
  }
  refreshVoiceAvailability();
  if (voiceSupported) {
    window.speechSynthesis.addEventListener('voiceschanged', refreshVoiceAvailability);
  }

  let isPlaying = false;
  function stopVoice() {
    isPlaying = false;
    window.speechSynthesis.cancel();
    voiceBtn.classList.remove('active');
    voiceBtn.innerHTML = PLAY_ICON;
  }

  function playVoiceLoop() {
    if (!isPlaying) return;
    const fullText = lines.join(' ');
    const utterance = new SpeechSynthesisUtterance(fullText);
    utterance.voice = voiceForLang;
    utterance.lang = meta.bcp47;
    utterance.rate = 0.9;
    utterance.onend = () => {
      if (isPlaying) playVoiceLoop();
    };
    window.speechSynthesis.speak(utterance);
  }

  voiceBtn.addEventListener('click', () => {
    if (voiceBtn.classList.contains('unavailable')) return;

    const wasPlaying = isPlaying;
    stopAllVoicesExcept(voiceBtn);

    if (wasPlaying) {
      // it was already playing — the stop-all above already stopped it, so we're done
      return;
    }

    isPlaying = true;
    voiceBtn.classList.add('active');
    voiceBtn.innerHTML = STOP_ICON;
    playVoiceLoop();
  });

  // Register this block's stop function so other voice buttons can silence it when they start playing
  activeVoiceStoppers.push(() => { if (isPlaying) stopVoice(); });

  const iconsWrap = document.createElement('div');
  iconsWrap.className = 'lang-icons';
  iconsWrap.appendChild(shareBtn);
  iconsWrap.appendChild(practiceBtn);
  iconsWrap.appendChild(voiceBtn);

  header.appendChild(tag);
  header.appendChild(iconsWrap);

  const text = document.createElement('p');
  text.className = `verse-text ${meta.cls.split(' ')[1] || meta.cls.split(' ')[0]}`;

  const wordCounterRef = { count: 0 };
  lines.forEach(line => {
    const span = document.createElement('span');
    span.className = 'vline';
    text.appendChild(span);
    renderLine(span, line, 'off', wordCounterRef);
  });

  block.appendChild(header);
  block.appendChild(refSpan);
  block.appendChild(text);
  return block;
}

// Renders a line as plain text (practiceState === 'off'), or with words blanked out per pattern.
// Pattern A hides odd-position words, Pattern B hides even-position words, Pattern C hides all words.
// wordCounterRef.count runs continuous across the whole verse (not reset per line), so the
// alternation stays consistent from line to line.
function renderLine(lineEl, lineText, practiceState, wordCounterRef) {
  lineEl.innerHTML = '';
  if (practiceState === 'off') {
    lineEl.textContent = lineText;
    return;
  }
  const chunks = lineText.split(' ');
  chunks.forEach((chunk, i) => {
    if (chunk.length === 0) return;
    const isOddPosition = wordCounterRef.count % 2 === 1;
    let isHidden;
    if (practiceState === 'C') {
      isHidden = true;
    } else {
      isHidden = practiceState === 'A' ? isOddPosition : !isOddPosition;
    }
    wordCounterRef.count++;

    if (isHidden) {
      const blank = document.createElement('span');
      blank.className = 'word-blank';
      blank.textContent = chunk;
      blank.addEventListener('click', () => {
        blank.classList.add('revealed');
      });
      lineEl.appendChild(blank);
    } else {
      lineEl.appendChild(document.createTextNode(chunk));
    }

    if (i < chunks.length - 1) {
      lineEl.appendChild(document.createTextNode(' '));
    }
  });
}

function buildPanel(version, displayLabel) {
  const panel = document.createElement('div');
  panel.className = 'version-panel';
  panel.dataset.key = version.key;

  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = `<span class="ref">${version.ref}</span><span class="version-tag">${displayLabel}</span>`;
  card.appendChild(head);

  LANG_ORDER.forEach(langKey => {
    if (version.verses[langKey]) {
      const entry = version.verses[langKey];
      const langRef = (entry && entry.ref) ? entry.ref : version.ref;
      const langLines = (entry && entry.lines) ? entry.lines : entry;
      card.appendChild(buildLangBlock(langKey, langLines, langRef));
    }
  });

  const foot = document.createElement('div');
  foot.className = 'card-foot';
  foot.textContent = 'Scripture Memory — Emmanuel Believers\' Fellowship';
  card.appendChild(foot);

  panel.appendChild(card);
  return panel;
}

// Build tabs + panels
WEEK.versions.forEach((version, i) => {
  const displayLabel = WEEK.versions.length === 1 ? 'Full Version' : version.label;

  const tab = document.createElement('button');
  tab.className = 'tab' + (i === 0 ? ' active' : '') + (WEEK.versions.length === 1 ? ' only' : '');
  tab.textContent = displayLabel;
  tab.dataset.key = version.key;
  if (WEEK.versions.length > 1) {
    tab.addEventListener('click', () => setActive(version.key));
  }
  tabsEl.appendChild(tab);

  const panel = buildPanel(version, displayLabel);
  if (i === 0) panel.classList.add('active');
  panelsEl.appendChild(panel);
});

function setActive(key) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
  document.querySelectorAll('.version-panel').forEach(p => p.classList.toggle('active', p.dataset.key === key));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function getShareText() {
  const activePanel = document.querySelector('.version-panel.active');
  const activeVersion = WEEK.versions.find(v => v.key === activePanel.dataset.key);
  const langBlocks = activePanel.querySelectorAll('.lang-block');
  let text = activeVersion.ref + '\n\n';
  
  langBlocks.forEach(block => {
    const langTag = block.querySelector('.lang-tag').textContent;
    const langRefEl = block.querySelector('.lang-ref');
    const langRef = langRefEl ? langRefEl.textContent : '';
    const verseLines = block.querySelectorAll('.vline');
    text += langTag + '\n';
    if (langRef) {
      text += langRef + '\n';
    }
    verseLines.forEach(line => {
      text += line.textContent + '\n';
    });
    text += '\n';
  });
  
  return text.trim();
}

async function shareSingleLanguage(versionRef, langTag, lines) {
  const text = `${versionRef}\n\n${lines.join('\n')}`;

  if (navigator.share) {
    try {
      await navigator.share({ title: versionRef, text: text });
      showToast('Shared!');
      return;
    } catch (err) {
      if (err.name !== 'AbortError') console.error('Share failed:', err);
      return;
    }
  }

  try {
    await navigator.clipboard.writeText(text);
    showToast(`${langTag} copied to clipboard`);
  } catch (err) {
    showToast('Could not share — try copying manually');
  }
}

document.getElementById('shareBtn').addEventListener('click', async () => {
  const shareText = getShareText();
  const btn = document.getElementById('shareBtn');
  const activePanel = document.querySelector('.version-panel.active');
  const activeVersion = WEEK.versions.find(v => v.key === activePanel.dataset.key);
  
  // Try native share first
  if (navigator.share) {
    try {
      await navigator.share({
        title: activeVersion.ref,
        text: shareText
      });
      showToast('Shared!');
      return;
    } catch (err) {
      if (err.name !== 'AbortError') {
        console.error('Share failed:', err);
      }
      // Fall through to clipboard
    }
  }
  
  // Fallback: copy to clipboard
  try {
    await navigator.clipboard.writeText(shareText);
    showToast('Copied to clipboard');
  } catch (err) {
    showToast('Could not share — try copying manually');
  }
});
</script>
